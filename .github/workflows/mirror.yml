name: Mirror to Gitee & AtomGit

on:
  push:
    branches: ["main"]
    tags: ["**"]
  workflow_dispatch:

# Serialize all mirror pushes; cancelling midway can leave mirrors out of sync.
concurrency:
  group: mirror-newenergycoder-club
  cancel-in-progress: false

jobs:
  mirror:
    # Never let a fork or a renamed copy overwrite the official mirrors.
    if: github.repository == 'necc-hub/newenergycoder.club'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GIT_LFS_SKIP_PUSH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fast-forward-only: diverged mirrors fail instead of being overwritten.
      # new_energy_coder_club is a separate historical archive, not a mirror.
      - name: Push to Gitee (newenergycoder.club)
        run: |
          REMOTE="https://darrenpig:${{ secrets.GITEE_TOKEN }}@gitee.com/darrenpig/newenergycoder.club.git"
          git push "$REMOTE" "refs/remotes/origin/main:refs/heads/main" "refs/tags/*:refs/tags/*"

      - name: Push to AtomGit (newenergycoder.club)
        run: |
          REMOTE="https://Darrenpig:${{ secrets.ATOMGIT_TOKEN }}@atomgit.com/cnec/newenergycoder.club.git"
          git push "$REMOTE" "refs/remotes/origin/main:refs/heads/main" "refs/tags/*:refs/tags/*"
